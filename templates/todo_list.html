{% extends 'base.html' %}
{% block content %}
  <h1>To‑Do 목록</h1>
  <a href="{% url 'cbv:cbv_todo_create' %}">새로 만들기</a>
  <form method="get"><input name="q" value="{{ request.GET.q }}"><button>검색</button></form>
  {% for todo in todos %}
    <p>
      <a href="{% url 'cbv:cbv_todo_info' todo.pk %}">{{ todo.title }}</a>
    </p>
  {% endfor %}
  {% include 'pagination.html' with page_obj=page_obj %}
{% endblock %}
