<!DOCTYPE html>
<html lang="en">
<html>
<head>
  <meta charset="UTF-8">
  <title>{% block title %}My To-Do App{% endblock %}</title>
  <title>{% block title %}My Site{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'login' %}">홈 로그인</a>
    {% if user.is_authenticated %}
      <a href="{% url 'todo:list' %}">내 To-Do</a>
      <a href="{% url 'users:logout' %}">로그아웃</a>
    {% else %}
      <a href="{% url 'users:login' %}">로그인</a>
      <a href="{% url 'users:signup' %}">회원가입</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
      <!-- … -->
    {% endif %}
  </nav>

  {% if user.is_authenticated %}
  …
{% else %}
  <a href="{% url 'signup' %}">회원가입</a> |
  <a href="{% url 'login' %}">로그인</a>
{% endif %}

  {# 여기가 가장 중요! #}
  {% block content %}
  {% endblock %}

</body>
</html>
