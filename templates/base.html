<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}My To‑Do App{% endblock %}</title>
</head>
<body>
  <nav>
    {% if user.is_authenticated %}
      안녕하세요, {{ user.username }} |
      <a href="{% url 'logout' %}">로그아웃</a>
    {% else %}
      <a href="{% url 'signup' %}">회원가입</a> |
      <a href="{% url 'login' %}">로그인</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
